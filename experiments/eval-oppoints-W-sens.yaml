# W-sens: extra operating points (0.5% and 5% false positives on the same 2000 held-out Alpaca answers as the default 1%
# point) of the final EMA probes, as eval-oppoints-W-coop. Their stored scores give every threshold of the Pareto sweep
# (pareto_sweep.py), so each variant can be drawn over thresholds. The default calibration is untouched.
entrypoint: run_calibrate_probe.py
name: oppoints-{+run}-ema
time_per_run: 01:30:00
overrides:
  +block: W-sens
  adapter_path: ${root_dir}/checkpoints_coop/${block}/${run}/ema_adapter
  checkpoint_path: ${root_dir}/checkpoints_coop/${block}/${run}/ema_reader.pt
  calibration_window: calib
  fprs: [0.005, 0.05]
artifacts:
- checkpoints_coop/{+block}/{+run}/operating_points/ema_reader/threshold_fpr0.05_calib.json
sweep:
  +run: [W-sens-gate0.0-s0, W-sens-gate0.25-s0, W-sens-rep0.5-s0, W-sens-rep2.0-s0]
