# More pgd completions for the response channel (see attack-pgd-harmbench-b0-80.yaml, whose shards
# 1-3 OOMed on HarmBench's long contextual behaviors). These are the first 80 dataset positions >= 20
# whose prompt is <= 300 tokens (shard 0, which ran, peaked at 416). Same output cell, so
# train_response_head.py reads them together with shard 0.
entrypoint: run_attacks.py
time_per_run: 01:00:00
overrides:
  attack: pgd
  model: E-nd6-s0
  dataset: adv_behaviors
  attacks.pgd.log_embeddings: false
sweep:
  datasets.adv_behaviors.idx:
  - [20, 21, 22, 25, 26, 27, 28, 30, 31, 32, 34, 35, 38, 39, 40, 42, 43, 46, 47, 48]
  - [49, 50, 51, 53, 54, 55, 57, 58, 59, 60, 61, 64, 65, 67, 68, 71, 72, 73, 74, 75]
  - [77, 78, 79, 80, 81, 82, 83, 84, 85, 86, 87, 88, 89, 90, 91, 93, 94, 95, 96, 98]
  - [99, 100, 101, 102, 104, 105, 106, 107, 108, 110, 111, 112, 113, 114, 115, 117, 118, 119, 120, 121]
