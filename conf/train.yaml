defaults:
  - models: models
  - paths
  - _self_

mode: model_cat

name: cat_run

# Key into models.yaml, which supplies the full schema load_model_and_tokenizer expects.
model: meta-llama/Meta-Llama-3.1-8B-Instruct
# Same weights, but get_chat_template() matches this id by exact string equality and does
# not recognise the models.yaml spelling.
chat_template_id: meta-llama/Llama-3.1-8B-Instruct

update_mode: lora          # lora | full

model_objective: ce        # ce | ul | ipo
lambda_away: 1.0
lambda_toward: 1.0
lambda_kl: 1.0
beta: 0.1

attack:
  iters: 100
  eps: 1.0
  lr: 0.01

data:
  dir: ${root_dir}/data
  behaviors: behavior_datasets/extra_behavior_datasets/adv_training_behaviors.csv
  targets: optimizer_targets/extra_targets/adv_training_targets.json
  # _longer = 100 distinct contextual refusals; the plain file is one constant string
  # for every behavior (a much easier target to overfit toward).
  safe: safe_responses/adv_training_behaviors_safe_responses_longer.csv
  utility_fraction: 0.01
  harmful_batch_size: 8
  utility_batch_size: 8
  # Behaviors held out from training for best-checkpoint selection.
  val_size: 16
  val_seed: 0

training:
  lr: 5.0e-5
  n_steps: 450
  val_every: 25
  # Optional diagnostics (both off by default; enable to hunt the robustness/utility tradeoff):
  checkpoint_every: 0             # >0: also save a step-tagged checkpoint every N steps
  benign_val_n: 0                 # >0: free-generate on N UltraChat prompts at each val step, log refusal rate
  benign_val_max_new_tokens: 32   # short generation is enough to see whether it opens with a refusal

output:
  checkpoint_path: ${root_dir}/checkpoints_cat

wandb:
  enabled: true
  project: detector-ma
  entity: null
  dir: ${root_dir}/wandb_logs
