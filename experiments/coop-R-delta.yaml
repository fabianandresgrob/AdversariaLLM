# R: gate 0.25 with a rep-gate floor delta 0.25. With delta 0 the representation term switches off once the model
# refuses (w_harm ~0.1 late), and a probe refit on recent features beats the co-trained one by ~10 points of recall;
# a floor keeps pushing attacked-harmful representations apart for the probe. (delta was locked at 0 under the old,
# all-token attack.)
entrypoint: run_coop_train.py
name: R-gate{epsilon}-it{attack.iters}-delta{delta}-s{seed}
time_per_run: "08:00:00"
overrides:
  attack.enabled: true
  attack.perturb: user
  attack.target_eot: false
  attack.eps: 0.1
  training.n_detector_steps: 6
  training.val_every: 50
  training.rep_warmup_steps: 0
  training.benign_gen_n: 40
  training.ema_decay: 0.995
  data.kl_source: magpie
  data.kl_max_length: 1024
  data.val_size: 24
  data.val_targets: 6
  data.val_batch_size: 16
  lambda_benign_perturb: 1.0
  output.checkpoint_path: ${root_dir}/checkpoints_coop/R
  attack.use_detector: true
  attack.iters: 50
  training.n_steps: 1000
sweep:
  epsilon: [0.25]
  delta: [0.25]
  seed: [0]
artifacts:
  - checkpoints_coop/R/{name}/final_adapter
  - checkpoints_coop/R/{name}/final_reader.pt
