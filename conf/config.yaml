defaults:
  - attacks: attacks
  - datasets: datasets
  - models: models
  - defenses: defenses
  - paths
  - override hydra/launcher: a100h100.yaml
  - _self_

hydra:
  run:
    dir: ${root_dir}/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}/
  job:
    chdir: true
  sweep:
    dir: ${root_dir}/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}/

name: testing
save_dir: ${root_dir}/outputs/  # place to store results
embed_dir: ${root_dir}/embeddings/  # place to store embeddings for emebdding attacks
overwrite: false

classifiers: ["strong_reject"]  # anything from judgezoo
# true (the default from 2026-11-24): the judge pass after the attack scores only this run's (model, attack, defense)
# results. false (all runs before 2026-10-29, the default until 2026-11-24) also picks up any other unscored run that
# started in the same second, and parallel jobs then read each other's half-written run.json (/fast has no file locks)
judge_own_runs_only: true

# Top-level generation config for easier overriding
generation_config:
  temperature: 0.0
  top_p: 1.0
  top_k: 0
  max_new_tokens: 256
  num_return_sequences: 1

# overrides for parallelism
attack: null
dataset: adv_behaviors
model: null
defense: none
