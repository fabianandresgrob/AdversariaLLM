# Smoke test of the coop recipe (coop-W-coop) on google/gemma-3-12b-it: 30 steps, validation at step 0 and 30. Checks that the
# attack works on this model (step-0 attack success), that memory fits, and the time per step (for the time limit).
entrypoint: run_coop_train.py
name: smoke-coop-gemma3-12b-s{seed}
time_per_run: "03:00:00"
overrides:
  model: google/gemma-3-12b-it
  chat_template_id: google/gemma-3-12b-it
  attack.enabled: true
  attack.perturb: user
  attack.target_eot: false
  attack.eps: 0.1
  attack.iters: 50
  attack.use_detector: true
  reader.readout: response_window
  reader.readout_k: 512
  reader.window: 16
  probe_init: random
  data.answer_pool: ${root_dir}/outputs/eval/answer_pool/pool-heretic.jsonl
  data.answer_max_tokens: 512
  training.detector_refusal_negatives: true
  training.rep_warmup_steps: 50
  training.n_detector_steps: 6
  training.n_steps: 30
  training.val_every: 30
  training.checkpoint_every: 0
  training.benign_gen_n: 40
  training.ema_decay: 0.995
  data.kl_source: magpie
  data.kl_max_length: 1024
  data.val_size: 24
  data.val_targets: 6
  data.val_batch_size: 16
  lambda_benign_perturb: 1.0
  epsilon: 0.05
  output.checkpoint_path: ${root_dir}/checkpoints_coop/smoke-models
sweep:
  seed: [0]
artifacts:
  - checkpoints_coop/smoke-models/{name}/final_adapter
  - checkpoints_coop/smoke-models/{name}/final_reader.pt
