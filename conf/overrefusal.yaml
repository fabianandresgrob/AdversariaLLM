defaults:
  - models: models
  - datasets: datasets
  - splits
  - paths
  - _self_

# Over-refusal (utility/helpfulness) eval: refusal rate on benign sets that look harmful.
# Pairs with attack-harness ASR (robustness) to form the utility-vs-robustness trade-off.
# Reuses coop's _coop_validate path (chat template + greedy gen + refusal_rate) for parity.
model: meta-llama/Meta-Llama-3.1-8B-Instruct
chat_template_id: meta-llama/Llama-3.1-8B-Instruct

# name -> spec ('base' = un-adapted; or an adapter dir). Add coop/CAT via +checkpoints.<name>=<dir>
checkpoints:
  base: base

datasets_eval: [xs_test]   # the over-refusal benchmark; add more (e.g. [xs_test, or_bench]) if wanted
window: all           # xs_test is held out entirely -> eval all of it. Use window=test for or_bench/alpaca (avoids trained rows)
max_new_tokens: 256   # judge needs full responses (>=128); 32 was too short to tell full vs partial
limit: null           # optional per-dataset cap (only needed if you add a large set like alpaca)
val_seed: 0           # matches data.val_seed (same seeded windows as training)
out: ${root_dir}/outputs/overrefusal

# Generations are always cached to gens_cache_dir/gens_<name>_<ds>.json and reused on the next
# run (matched by prompt set) -> re-judging with new judge settings skips regeneration entirely.
gens_cache: true
gens_cache_dir: ${out}

# Opt-in LLM judge (Jonas's xstest harness). Off = the legacy string-match refusal_rate only.
# On = also gemma-3-12b-it 3-way judge + degeneration detector, counting gibberish as refusal.
judge:
  enabled: false
  model: google/gemma-3-12b-it
  dtype: bfloat16
  max_new_tokens: 64
  prompt_mode: legacy   # legacy = 3-class; degeneration_aware = adds a 4th malformed class

degeneration:           # heuristic gibberish flags (malformed -> counted as refusal, not compliance)
  enabled: true
  min_length: 20
  max_alnum_ratio: 0.18
  repeated_char_threshold: 9
  control_character_threshold: 4
