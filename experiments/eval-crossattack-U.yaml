# U: the answer-probe coop runs (checkpoints_coop/U), final and EMA checkpoints; as eval-crossattack-Q2.
entrypoint: run_cross_attack_eval.py
name: xattack-{+run}-{+ckpt}-a{seed}
time_per_run: "02:00:00"
overrides:
  +block: U
  adapter_path: ${root_dir}/checkpoints_coop/${block}/${run}/${ckpt}_adapter
  eval_use_detector: [true, false]
  eval_detector_coeffs: [0.5]
  attack.iters: 100
  attack.eps: 0.1
  attack.target_eot: false
  attack.perturb: user
  harmful.val_size: 24
  harmful.val_targets: 6
  harmful.batch_size: 16
  benign.benign_gen_n: 40
  judge.enabled: true
  harmful.answer_pool: ${root_dir}/outputs/eval/answer_pool/pool-heretic.jsonl
  harmful.answer_max_tokens: 128
  out: ${root_dir}/outputs/eval/cross_attack/${block}/${run}-${ckpt}/seed${seed}
sweep:
  +run: [U-answer-s0, U-answer-ownbenign-s0, U-answer-gate0.05-s0, U-answer-perturb-s0]
  +ckpt: [final, ema]
  seed: [0]
artifacts:
  - outputs/eval/cross_attack/{+block}/{+run}-{+ckpt}/seed{seed}/cross_attack_eval.json
