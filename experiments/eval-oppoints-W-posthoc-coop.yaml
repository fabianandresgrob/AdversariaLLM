# R2.5, probe trained on the frozen coop model: as eval-oppoints-W-coop.
entrypoint: run_calibrate_probe.py
name: oppoints-{+run}-ema
time_per_run: 01:30:00
overrides:
  adapter_path: ${root_dir}/checkpoints_coop/W-posthoc-coop/${run}/ema_adapter
  checkpoint_path: ${root_dir}/checkpoints_coop/W-posthoc-coop/${run}/ema_reader.pt
  calibration_window: calib
  fprs: [0.005, 0.05]
artifacts:
- checkpoints_coop/W-posthoc-coop/{+run}/operating_points/ema_reader/threshold_fpr0.05_calib.json
sweep:
  +run: [W-posthoc-coop-s0]
