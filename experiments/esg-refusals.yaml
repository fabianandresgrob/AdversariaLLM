# Refusal texts for coop training: base Llama-3.1-8B-Instruct answers the strictly harmful prompts whose own answer
# was judged harmful (scripts/esg_build_refusal_prompts.py), with a system prompt that tells it to decline
# (conf/system_prompts/refuse.txt). It reads `judge_text`, the plain request behind a rewrite where one is known.
# A store of its own, since the settings differ from the plain answers. Check afterwards with esg-refusals-judge.
entrypoint: generate_answers.py
name: esg-refusals-{+set}
time_per_run: "00:30:00"
overrides:
  prompts: /fast/fgrob/coop-detect/esg_data/samples/refusal_prompts_v1.parquet
  store: esg-llama31-base-refusals
  system_prompt_file: ${root_dir}/conf/system_prompts/refuse.txt
  text_column: judge_text
  max_new_tokens: 128
sweep:
  +set: [v1]
