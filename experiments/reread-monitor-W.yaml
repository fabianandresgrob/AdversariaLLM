# PAIR analysis, step 4: the re-read monitor (the probe scores the answer behind a neutral prompt), offline, for the
# 9 Llama W models: its own 1% / 0.5% / 5% thresholds on the Alpaca calibration answers, xs_test over-refusal, and the
# saved model-alone PAIR answers (reread_monitor_eval.py).
entrypoint: reread_monitor_eval.py
name: reread-{model}
time_per_run: "02:00:00"
sweep:
  model: [W-coop-s0-ema, W-coop-s1-ema, W-coop-s2-ema, W-posthoc-noprobe-s0-ema, W-posthoc-noprobe-s1-ema, W-posthoc-noprobe-s2-ema, W-posthoc-cat-s0-ema, W-posthoc-cat-s1-ema, W-posthoc-cat-s2-ema]
artifacts:
  - outputs/eval/reread_monitor/{model}.json
