# W: CAT KL 8 seed 0 at its step-500 EMA checkpoint (the one under xs_test 0.20): utility.
entrypoint: run_utility_eval.py
name: utility-{+run}-ema500
time_per_run: 02:00:00
overrides:
  +block: W
  adapter_path: ${root_dir}/checkpoints_cat/${block}/${run}/ema_step500_adapter
  vllm.max_lora_rank: 64          # the recipe's LoRA is rank 64
  out: ${root_dir}/outputs/eval/utility/${block}/${run}-ema500
artifacts:
- outputs/eval/utility/{+block}/{+run}-ema500/utility.json
sweep:
  +run: [W-cat-kl8.0-s0]
