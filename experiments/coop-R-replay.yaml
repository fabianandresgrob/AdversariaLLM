# R: gate 0.25 with detector replay. Each detector step's harmful half is the same 4 attacked prompts, so more
# detector steps mostly fit those 4 harder (20 steps did not beat 6 in the O runs); a probe refit on the last 100
# steps of features (~400 attacked prompts) reaches ~0.9 recall vs ~0.8 co-trained. Replay adds a loss on that
# buffer to every detector step. Note: detector/fresh_refit_recall then reads data the probe trained on.
entrypoint: run_coop_train.py
name: R-gate{epsilon}-it{attack.iters}-replay-s{seed}
time_per_run: "08:00:00"
overrides:
  attack.enabled: true
  attack.perturb: user
  attack.target_eot: false
  attack.eps: 0.1
  training.n_detector_steps: 6
  training.val_every: 50
  training.rep_warmup_steps: 0
  training.benign_gen_n: 40
  training.ema_decay: 0.995
  data.kl_source: magpie
  data.kl_max_length: 1024
  data.val_size: 24
  data.val_targets: 6
  data.val_batch_size: 16
  lambda_benign_perturb: 1.0
  output.checkpoint_path: ${root_dir}/checkpoints_coop/R
  attack.use_detector: true
  attack.iters: 50
  training.n_steps: 1000
  training.detector_replay: true
sweep:
  epsilon: [0.25]
  seed: [0]
artifacts:
  - checkpoints_coop/R/{name}/final_adapter
  - checkpoints_coop/R/{name}/final_reader.pt
