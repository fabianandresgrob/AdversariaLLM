# Q checkpoints under the attack they trained against, but at the full 100 iterations (it50 trained and validated
# at 50), detector-aware (c=0.5, native) and model-only. Same 24 val behaviors x 6 targets as the Q training logs.
entrypoint: run_cross_attack_eval.py
name: xattack-{+run}-a{seed}
time_per_run: "02:00:00"
overrides:
  +block: Q
  adapter_path: ${root_dir}/checkpoints_coop/${block}/${run}/final_adapter
  eval_use_detector: [true, false]
  eval_detector_coeffs: [0.5]
  attack.iters: 100
  attack.eps: 0.1
  attack.target_eot: false
  attack.perturb: user
  harmful.val_size: 24
  harmful.val_targets: 6
  harmful.batch_size: 16
  benign.benign_gen_n: 40
  out: ${root_dir}/outputs/eval/cross_attack/${block}/${run}/seed${seed}
sweep:
  +run: [Q-bp-it50-s0]
  seed: [0]
artifacts:
  - outputs/eval/cross_attack/{+block}/{+run}/seed{seed}/cross_attack_eval.json
