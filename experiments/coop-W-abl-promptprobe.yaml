# W ablation: coop with a prompt probe instead of the answer probe. The probe reads the last prompt token
# (reader.readout: prompt_last), cold start as coop's; refusal negatives off (with a prompt-only readout they would
# label the same prompt harmful and harmless). Everything else identical to coop-W-coop; seed 0. Isolates the readout:
# the earlier prompt-probe runs (Q) also differed in warm start, answer pool and gate floor.
entrypoint: run_coop_train.py
name: W-abl-promptprobe-s{seed}
time_per_run: "12:00:00"
overrides:
  attack.enabled: true
  attack.perturb: user
  attack.target_eot: false
  attack.eps: 0.1
  attack.iters: 50
  attack.use_detector: true
  reader.readout: prompt_last
  probe_init: random
  data.answer_pool: ${root_dir}/outputs/eval/answer_pool/pool-heretic.jsonl
  data.answer_max_tokens: 512
  training.detector_refusal_negatives: false   # a prompt probe would see the same prompt as harmful and harmless
  training.rep_warmup_steps: 50
  training.n_detector_steps: 6
  training.n_steps: 1000
  training.val_every: 50
  training.checkpoint_every: 250
  training.benign_gen_n: 40
  training.ema_decay: 0.995
  data.kl_source: magpie
  data.kl_max_length: 1024
  data.val_size: 24
  data.val_targets: 6
  data.val_batch_size: 16
  lambda_benign_perturb: 1.0
  epsilon: 0.05
  output.checkpoint_path: ${root_dir}/checkpoints_coop/W-abl
sweep:
  seed: [0]
artifacts:
  - checkpoints_coop/W-abl/{name}/final_adapter
  - checkpoints_coop/W-abl/{name}/final_reader.pt
