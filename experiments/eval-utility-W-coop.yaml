# W: the coop arm's final EMA models: lm_eval MMLU / ARC-C / GSM8K.
entrypoint: run_utility_eval.py
name: utility-{+run}-ema
time_per_run: 02:00:00
overrides:
  +block: W
  adapter_path: ${root_dir}/checkpoints_coop/${block}/${run}/ema_adapter
  out: ${root_dir}/outputs/eval/utility/${block}/${run}-ema
artifacts:
- outputs/eval/utility/{+block}/{+run}-ema/utility.json
sweep:
  +run: [W-coop-s0, W-coop-s1, W-coop-s2]
