defaults:
  - models: models
  - datasets: datasets
  - paths
  - _self_

name: probe_v1
model: meta-llama/Meta-Llama-3.1-8B-Instruct
chat_template_id: meta-llama/Llama-3.1-8B-Instruct

reader:
  layer: -1

data:
  dir: ${root_dir}/data
  behaviors: behavior_datasets/harmbench_behaviors_text_all.csv   # ~1530 harmful behaviors
  harmful_col: Behavior
  n_harmful: 300
  # Diverse benign from AdversariaLLM's own datasets. The probe's benign class is trained
  # on the MIX of train_benign_sources; eval_only_sources are held-out distributions for
  # a cross-distribution generalization check. All are evaluated on their held-out portion.
  train_benign_sources: [alpaca, or_bench, xs_test]
  eval_only_sources: []          # e.g. [mmlu] to add a fully-OOD benign check
  n_benign_per_source: 300
  train_frac: 0.7
  seed: 0

train:
  lr: 1.0e-3
  steps: 500

output:
  probe_path: ${root_dir}/checkpoints_probe
