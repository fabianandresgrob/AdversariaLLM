# X: reference points for the CAT calibration on Qwen2.5-7B-Instruct: judged xs_test over-refusal of the base model and of the coop
# model alone (X-coop-qwen25-7b, EMA), with the same judge as eval-overrefusal-X-cat-qwen25-7b. Model and chat template set
# explicitly (defaults are Llama). The pipeline over-refusal (model + probe) comes later, after the probe is calibrated.
entrypoint: run_overrefusal_eval.py
name: overrefusal-X-ref-qwen25-7b
time_per_run: 02:00:00
overrides:
  +block: X
  model: Qwen/Qwen2.5-7B-Instruct
  chat_template_id: Qwen/Qwen2.5-7B-Instruct
  +checkpoints.coop: ${root_dir}/checkpoints_coop/X/X-coop-qwen25-7b-s0/ema_adapter
  out: ${root_dir}/outputs/eval/overrefusal/X/ref-qwen25-7b
  judge.enabled: true
artifacts:
- outputs/eval/overrefusal/X/ref-qwen25-7b/overrefusal.json
