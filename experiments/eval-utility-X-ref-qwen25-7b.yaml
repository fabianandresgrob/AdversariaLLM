# X: utility of the base Qwen/Qwen2.5-7B-Instruct, the reference for its trained arms. Standard lm_eval tasks with the shot counts of
# the model's own report (Qwen2.5 report: GSM8K 4-shot, MMLU 5-shot, ARC-C 25-shot), chat template, few-shot as multiturn; the model's tokenizer template.
entrypoint: run_utility_eval.py
name: utility-X-ref-qwen25-7b
time_per_run: 03:00:00
overrides:
  model: Qwen/Qwen2.5-7B-Instruct
  gen_kwargs: max_gen_toks=1024  # chat answers to GSM8K run past lm_eval's default 256 tokens
  tasks: [gsm8k:4, mmlu:5, arc_challenge:25]
  out: ${root_dir}/outputs/eval/utility/X/ref-qwen25-7b
artifacts:
- outputs/eval/utility/X/ref-qwen25-7b/utility.json
