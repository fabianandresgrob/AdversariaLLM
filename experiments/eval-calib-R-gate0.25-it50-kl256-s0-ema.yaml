# 1%-FPR calibration (2000 held-out alpaca) of the EMA probe in checkpoints_coop/R/R-gate0.25-it50-kl256-s0-ema (symlinks to the run's
# ema_adapter / ema_reader.pt), so defense=coop_probe can use it; as eval-calib-Q-ema.
entrypoint: run_calibrate_probe.py
name: calib-{+run}
time_per_run: 01:30:00
overrides:
  +block: R
  adapter_path: ${root_dir}/checkpoints_coop/${block}/${run}/final_adapter
  checkpoint_path: ${root_dir}/checkpoints_coop/${block}/${run}/final_reader.pt
  calibration_window: calib
artifacts:
- checkpoints_coop/{+block}/{+run}/threshold_1pct_calib.json
sweep:
  +run:
  - R-gate0.25-it50-kl256-s0-ema
