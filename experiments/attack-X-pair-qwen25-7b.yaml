# X (Qwen/Qwen2.5-7B-Instruct): PAIR on the model alone, JBB 0-19, vicuna attacker and judge. Model and chat template set explicitly (defaults are Llama).
entrypoint: run_attacks.py
name: pair-{model}-b0-20
time_per_run: 06:00:00
overrides:
  attack: pair
  dataset: jbb_behaviors
  datasets.jbb_behaviors.idx: list(range(0,20))
  attacks.pair.attack_model.max_attempts: 30
  attacks.pair.judge_model.id: lmsys/vicuna-13b-v1.5
  attacks.pair.judge_model.tokenizer_id: lmsys/vicuna-13b-v1.5
sweep:
  model: [X-coop-qwen25-7b-s0-ema, X-posthoc-noprobe-qwen25-7b-s0-ema, X-posthoc-cat-qwen25-7b-s0-ema]  # arms are added as their probes finish
