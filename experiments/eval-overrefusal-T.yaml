# CAT following Leo's recipe (cat-T-leo-*, conf/cat_recipe/leo.yaml): full xs_test over-refusal (string match + judge).
entrypoint: run_overrefusal_eval.py
name: overrefusal-{+run}
time_per_run: 02:00:00
overrides:
  +block: T-cat
  ~checkpoints.base: base
  +checkpoints.model: ${root_dir}/checkpoints_cat/${block}/${run}/final_adapter
  out: ${root_dir}/outputs/eval/overrefusal/${block}/${run}
  judge.enabled: true
artifacts:
- outputs/eval/overrefusal/{+block}/{+run}/overrefusal.json
sweep:
  +run:
  - T-cat-leo-s0
  - T-cat-leo-coopattack-s0
  - T-cat-leo-magpie-s0
  - T-cat-leo-magpie-coopattack-s0
  - T-cat-leo-magpie-kl-coopattack-s0
  - T-cat-leo-midattack-s0
