# Canonical dataset splits — one source of truth, reused across probe pretraining, coop
# training, coop validation, and final eval. Disjoint index windows [start, end) over each
# dataset's seeded-shuffled order. See MA/planning/specs/2026-08-04-data-splits.md.
# Rule: train fits params; val selects (checkpoints/metrics); test is reported-only.
splits:
  alpaca:    {train: [0, 400], val: [400, 500], test: [500, 700]}
  or_bench:  {train: [0, 400], val: [400, 500], test: [500, 700]}
  xs_test:   {train: [0, 120], val: [120, 160], test: [160, 200]}
  ultrachat: {train: [0, 2000], val: [2000, 2200], test: [2200, 2400]}
  magpie:    {train: [0, 2000], val: [2000, 2200], test: [2200, 2400]}
