# R: coop gate 0.25 with a model-only attack in training (everything else as Q-bp-it50-gate0.25). The no-probe
# baseline over-refuses less than coop; the suspected cause is the detector-aware attack, which pushes attacked
# prompts toward the probe's benign region, while the gate puts the refusal loss on exactly those probe-evading,
# benign-looking attacks. If this run's over-refusal drops to the baseline's, that is the cause.
entrypoint: run_coop_train.py
name: R-gate{epsilon}-it{attack.iters}-modelonly-s{seed}
time_per_run: "08:00:00"
overrides:
  attack.enabled: true
  attack.perturb: user
  attack.target_eot: false
  attack.eps: 0.1
  training.n_detector_steps: 6
  training.val_every: 50
  training.rep_warmup_steps: 0
  training.benign_gen_n: 40
  training.ema_decay: 0.995
  data.kl_source: magpie
  data.kl_max_length: 1024
  data.val_size: 24
  data.val_targets: 6
  data.val_batch_size: 16
  lambda_benign_perturb: 1.0
  output.checkpoint_path: ${root_dir}/checkpoints_coop/R
  attack.use_detector: false
  attack.iters: 50
  training.n_steps: 1000
sweep:
  epsilon: [0.25]
  seed: [0]
artifacts:
  - checkpoints_coop/R/{name}/final_adapter
  - checkpoints_coop/R/{name}/final_reader.pt
