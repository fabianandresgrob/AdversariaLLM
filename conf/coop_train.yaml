defaults:
  - models: models
  - datasets: datasets
  - splits
  - paths
  - _self_

mode: coop
name: coop_run

# Same target as model-CAT: models.yaml key for loading, separate id for get_chat_template.
model: meta-llama/Meta-Llama-3.1-8B-Instruct
chat_template_id: meta-llama/Llama-3.1-8B-Instruct

reader:
  type: linear        # linear | (mlp/gemma later)
  layer: -1           # target-model hidden layer the probe reads
# "random" or a pretrained probe.pt from run_pretrain_probe (fixes the OOD-benign collapse).
probe_init: ${root_dir}/checkpoints_probe/probe_v1/probe.pt

# Gating / objective (design doc §3-§6). Floors default to the decoupled (1,1) control.
tau: 1.0
tau_b: 1.0            # SEPARATE benign-gate temperature (short refusal vs long answer; §8)
epsilon: 0.05         # behavior-gate floor
delta: 0.0            # rep-gate floor; LOCKED at 0 (v1 stability result)
lambda_beh: 1.0
lambda_rep: 1.0
lambda_kl: 1.0
lambda_help: 1.0      # hard-benign gated CE
lambda_help_easy: 0.0 # ablation hook (easy-benign ungated CE)
lambda_kl_hard: 0.0   # ablation hook (hard-benign KL)
refusal_opener: "I can't help with that."      # w_mb refuse side
compliance_opener: "Sure, I can help with that."  # w_mb comply side

# Stage A = no attack (clean prompt); Stage B = continuous embedding attack.
attack:
  enabled: false
  iters: 100
  eps: 1.0
  lr: 0.01

data:
  dir: ${root_dir}/data
  behaviors: behavior_datasets/extra_behavior_datasets/adv_training_behaviors.csv
  targets: optimizer_targets/extra_targets/adv_training_targets.json
  safe: safe_responses/adv_training_behaviors_safe_responses_longer.csv
  harmful_batch_size: 4
  utility_batch_size: 4
  val_size: 16                      # harmful behaviors held out for validation
  val_seed: 0
  # Benign split: easy = detector class + PINNED calibration; hard = gated-CE + detector (opt-in).
  # KL uses ultrachat train. xs_test is NEVER a training source (held out for over-refusal + FPR).
  easy_benign_sources: [alpaca]     # detector easy-benign class (train windows); NOT xs_test
  calibration_benign: alpaca        # PINNED 1%-FPR threshold set (val window), frozen across runs
  hard_benign_sources: []           # opt-in; set to [or_bench] to enable the hard-benign term
  benign_targets_path: ${root_dir}/data/benign_targets/or_bench_ygen.json

training:
  model_lr: 5.0e-5
  detector_lr: 1.0e-3        # detector is cheap/fast (§8): higher lr than the model
  n_steps: 450
  n_detector_steps: 1        # spec default (tunable ablation; δ=0/N=3 is a valid alt)
  rep_warmup_steps: 0        # default off (prefitted probe); >0 for the cold-probe ablation
  checkpoint_every: 50
  val_every: 25              # held-out recall@1%FPR, OOD over-refusal, four-case frequencies
  benign_gen_n: 16           # OOD benign prompts to free-generate on for the refusal rate
  benign_val_max_new_tokens: 32

output:
  checkpoint_path: ${root_dir}/checkpoints_coop

wandb:
  enabled: true
  project: detector-ma
  entity: null
  dir: ${root_dir}/wandb_logs
