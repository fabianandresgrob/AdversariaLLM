# L (round 2): does probe pretraining help when the attack defeats probe_v3 at init? Matched to E-nd1
# (eps=0.05, detector-aware, ndet=1) except probe_init=random. A null result deletes run_pretrain_probe.py.
entrypoint: run_coop_train.py
name: L-cold-s{seed}
time_per_run: "05:00:00"
overrides:
  attack.enabled: true
  training.n_steps: 1000
  training.val_every: 25
  data.kl_source: magpie
  data.kl_max_length: 1024
  epsilon: 0.05
  attack.use_detector: true
  probe_init: random
  training.rep_warmup_steps: 0
  output.checkpoint_path: ${root_dir}/checkpoints_coop/L-cold-adaptive
sweep:
  seed: [0, 1, 2]
artifacts:
  - checkpoints_coop/L-cold-adaptive/{name}/final_adapter
  - checkpoints_coop/L-cold-adaptive/{name}/final_reader.pt
