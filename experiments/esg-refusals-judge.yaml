# Check of the generated refusals: StrongREJECT on each refusal against the request it answers. A refusal that works
# scores near 0. The refusal flag (a string match) is written at generation.
entrypoint: generate_answers.py
name: esg-refusals-judge-{+set}
time_per_run: "00:30:00"
overrides:
  stage: judge
  prompts: /fast/fgrob/coop-detect/esg_data/samples/refusal_prompts_v1.parquet
  store: esg-llama31-base-refusals
  # the generation settings of esg-refusals: the store refuses a run whose settings differ from the stored ones
  system_prompt_file: ${root_dir}/conf/system_prompts/refuse.txt
  text_column: judge_text
  max_new_tokens: 128
sweep:
  +set: [v1]
