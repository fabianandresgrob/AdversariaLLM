defaults:
  - models: models
  - datasets: datasets
  - splits
  - paths
  - _self_

# Compute the 1%-FPR operating threshold for a coop probe on the co-trained model, so the
# monitor defense uses the same operating point as coop validation. Scores easy benign
# (pinned calibration set) through LinearProbeMonitor, tau = (1-fpr) quantile of P(harmful).
model: meta-llama/Meta-Llama-3.1-8B-Instruct
chat_template_id: meta-llama/Llama-3.1-8B-Instruct

adapter_path: ???        # coop <tag>_adapter (LoRA on the target model)
checkpoint_path: ???     # coop <tag>_reader.pt (the probe)
layer: -1
batch_size: 16
# Response readouts only: how much of the benign answer to generate before scoring. 256 matches
# the generation budget the attacks give the target, so the calibration and eval distributions agree.
max_new_tokens: 256
calibration_benign: alpaca   # PINNED easy-benign set (matches coop_train.calibration_benign)
calibration_window: val      # split window: val = training-time point (threshold_<p>pct.json);
                             # calib = large held-out window (threshold_<p>pct_calib.json)
val_seed: 0                  # matches data.val_seed
fpr: 0.01

# probe_diagnose.py only (ignored by run_calibrate_probe.py)
hits: hits.json               # inspect_attacks.py --json output
limit: 40                     # examples per set
targets_path: ${root_dir}/data/optimizer_targets/extra_targets/adv_training_targets.json
threshold: null               # probe operating point; null -> 0.5. Pass the calibrated one.
