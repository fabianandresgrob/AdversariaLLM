# X: post-hoc probe on the frozen CAT model on Qwen2.5-7B: KL 16 at its step-500 EMA checkpoint (xs_test 0.28, the closest
# to coop's 0.26; no KL weight from 4 to 64 reaches it). As coop-W-posthoc-cat on Llama; the same probe recipe and
# training attack as coop-X-coop-qwen25-7b, only the model is loaded and frozen.
entrypoint: run_coop_train.py
name: X-posthoc-cat-qwen25-7b-s{seed}
time_per_run: "12:00:00"
overrides:
  init_adapter: ${root_dir}/checkpoints_cat/X/X-cat-qwen25-7b-kl16.0-s${seed}/ema_step500_adapter
  training.train_model: false
  model: Qwen/Qwen2.5-7B-Instruct
  chat_template_id: Qwen/Qwen2.5-7B-Instruct
  attack.enabled: true
  attack.perturb: user
  attack.target_eot: false
  attack.eps: 0.3
  attack.iters: 50
  attack.use_detector: true
  reader.readout: response_window
  reader.readout_k: 512
  reader.window: 16
  probe_init: random
  data.answer_pool: ${root_dir}/outputs/eval/answer_pool/pool-heretic.jsonl
  data.answer_max_tokens: 512
  training.detector_refusal_negatives: true
  training.rep_warmup_steps: 50
  training.n_detector_steps: 6
  training.n_steps: 1000
  training.val_every: 50
  training.checkpoint_every: 250
  training.benign_gen_n: 40
  training.ema_decay: 0.995
  data.kl_source: magpie
  data.kl_max_length: 1024
  data.val_size: 24
  data.val_targets: 6
  data.val_batch_size: 16
  lambda_benign_perturb: 1.0
  epsilon: 0.05
  output.checkpoint_path: ${root_dir}/checkpoints_coop/X-posthoc-cat
sweep:
  seed: [0]
artifacts:
  - checkpoints_coop/X-posthoc-cat/{name}/final_adapter
  - checkpoints_coop/X-posthoc-cat/{name}/final_reader.pt
