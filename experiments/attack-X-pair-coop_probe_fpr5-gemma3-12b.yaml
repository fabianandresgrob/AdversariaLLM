# X (google/gemma-3-12b-it): PAIR against the pipeline at the 5%-FPR operating point (threshold sweep, as attack-pair-coop_probe_fpr5-b0-20 on Llama), JBB 0-19. Model and chat template set explicitly (defaults are Llama).
entrypoint: run_attacks.py
name: pair-{model}-b0-20
time_per_run: 06:00:00
overrides:
  attack: pair
  dataset: jbb_behaviors
  datasets.jbb_behaviors.idx: list(range(0,20))
  attacks.pair.attack_model.max_attempts: 30
  attacks.pair.judge_model.id: lmsys/vicuna-13b-v1.5
  attacks.pair.judge_model.tokenizer_id: lmsys/vicuna-13b-v1.5
  defense: coop_probe_fpr5
sweep:
  model: [X-coop-gemma3-12b-s0-ema, X-posthoc-noprobe-gemma3-12b-s0-ema, X-posthoc-cat-gemma3-12b-s0-ema]
