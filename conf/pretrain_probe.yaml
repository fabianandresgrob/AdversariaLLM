defaults:
  - models: models
  - datasets: datasets
  - splits
  - paths
  - _self_

name: probe_v1
model: meta-llama/Meta-Llama-3.1-8B-Instruct
chat_template_id: meta-llama/Llama-3.1-8B-Instruct

reader:
  layer: -1

data:
  dir: ${root_dir}/data
  # TRAIN harmful set (AdvBench), disjoint from the HarmBench test set. 519 behaviors.
  behaviors: behavior_datasets/extra_behavior_datasets/advbench_behaviors.csv
  harmful_col: Behavior
  n_harmful: 300
  # Probe benign class = MIX of these sources' TRAIN windows (conf/splits.yaml);
  # recall diagnostic is reported on their VAL windows.
  train_benign_sources: [alpaca, or_bench, xs_test]
  train_frac: 0.7          # harmful train/eval split for the pretraining diagnostic
  # OOD harmful for an honest diagnostic — a different benchmark (JailbreakBench),
  # disjoint from advbench-train and harmbench-test.
  eval_harmful_source: jbb_behaviors
  eval_harmful_window: [0, 100]
  seed: 0

train:
  lr: 1.0e-3
  steps: 500

output:
  probe_path: ${root_dir}/checkpoints_probe
