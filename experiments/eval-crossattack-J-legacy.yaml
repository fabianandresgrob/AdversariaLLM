# Robustness of the CAT baselines under the SAME continuous attack coop trains against. No probe exists for
# these checkpoints, so only the model-only condition is meaningful and comply == ASR (undefended pipeline);
# the reader stays random and its detector columns are ignored.
entrypoint: run_cross_attack_eval.py
name: xattack-{+run}-a{seed}
time_per_run: "02:00:00"
overrides:
  +block: J-legacy
  adapter_path: ${root_dir}/checkpoints_cat/${block}/${run}/final_adapter
  eval_use_detector: [false]
  out: ${root_dir}/outputs/eval/cross_attack/${block}/${run}/seed${seed}
sweep:
  +run: [J-legacy-ul-s0, J-legacy-ul-s1]
  seed: [0]
artifacts:
  - outputs/eval/cross_attack/{+block}/{+run}/seed{seed}/cross_attack_eval.json
