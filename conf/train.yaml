defaults:
  - models: models
  - datasets: datasets
  - splits
  - paths
  - _self_

mode: model_cat

name: cat_run
seed: 0                   # training randomness (LoRA init, shuffles); eval splits use data.val_seed

# Key into models.yaml, which supplies the full schema load_model_and_tokenizer expects.
model: meta-llama/Meta-Llama-3.1-8B-Instruct
# Same weights, but get_chat_template() matches this id by exact string equality and does
# not recognise the models.yaml spelling.
chat_template_id: meta-llama/Llama-3.1-8B-Instruct

update_mode: lora          # lora | full

model_objective: ce        # ce | ul | ipo
lambda_away: 1.0
lambda_toward: 1.0
lambda_kl: 1.0
beta: 0.1
# CAT's loss cutoffs (Xhonneux et al. 2024: away -5, Llama-2 -7.5; toward 0.5); null = off
away_cutoff: null
toward_cutoff: null
utility_objective: kl      # kl = KL leash to the reference (lambda_kl) | sft = next-token CE on the utility data (CAT)
lambda_utility: 1.0        # weight of the sft utility term

lora:                      # LoRA on all attention and MLP projections (CAT: r 64, alpha 16, dropout 0.1)
  r: 8
  alpha: 32
  dropout: 0.05

attack:
  iters: 100
  eps: 1.0
  lr: 0.01
  target_eot: true   # false = the end-of-turn token is not part of the attack target (coop_train.yaml's fix)
  perturb: all       # user = perturb only the user message, not the chat template (coop_train.yaml's fix)
  optimizer: adam    # adam | sign (CAT's SignSGD)
  relative_lr: false # true: lr is scaled by eps x the mean embedding norm

data:
  dir: ${root_dir}/data
  behaviors: behavior_datasets/extra_behavior_datasets/adv_training_behaviors.csv
  targets: optimizer_targets/extra_targets/adv_training_targets.json
  # _longer = 100 distinct contextual refusals; the plain file is one constant string
  # for every behavior (a much easier target to overfit toward).
  safe: safe_responses/adv_training_behaviors_safe_responses_longer.csv
  utility_fraction: 0.01            # ultrachat-only: fraction of the set used as the KL leash
  kl_source: ultrachat              # KL-leash dataset; any registered source (e.g. magpie) or ultrachat
  kl_max_length: null               # truncate leash examples to N tokens (magpie responses run ~90k chars)
  harmful_batch_size: 8
  utility_batch_size: 8
  # Behaviors held out from training for best-checkpoint selection.
  val_size: 16
  val_seed: 0

training:
  lr: 5.0e-5
  n_steps: 450
  n_epochs: null           # set: n_steps = epochs over the harmful train rows / (harmful_batch_size x grad_accum)
  grad_accum: 1            # micro-batches per optimizer step (CAT: 8 x (1 harmful + 7 utility) = 64)
  optimizer: adam          # adam | adamw
  weight_decay: 0.0
  lr_schedule: constant    # constant | cosine (with warmup_ratio of the steps as linear warmup)
  warmup_ratio: 0.0
  max_grad_norm: null      # gradient clipping (CAT: 0.3)
  val_every: 25
  # Optional diagnostics (both off by default; enable to hunt the robustness/utility tradeoff):
  checkpoint_every: 0             # >0: also save a step-tagged checkpoint every N steps
  benign_val_n: 0                 # >0: free-generate on N UltraChat prompts at each val step, log refusal rate
  benign_val_max_new_tokens: 32   # short generation is enough to see whether it opens with a refusal

output:
  checkpoint_path: ${root_dir}/checkpoints_cat

wandb:
  enabled: true
  project: detector-ma
  entity: null
  dir: ${root_dir}/wandb_logs
