# X (Qwen/Qwen2.5-7B-Instruct): extra operating points (0.5% and 5% FPR on the same 2000 Alpaca answers) for PAIR at other thresholds. Model and chat template set explicitly (defaults are Llama).
entrypoint: run_calibrate_probe.py
name: oppoints-{+arm}
time_per_run: 01:30:00
overrides:
  model: Qwen/Qwen2.5-7B-Instruct
  chat_template_id: Qwen/Qwen2.5-7B-Instruct
  adapter_path: ${models.${arm}.adapter_path}
  checkpoint_path: ${models.${arm}.reader_path}
  calibration_window: calib
  fprs: [0.005, 0.05]
sweep:
  +arm: [X-coop-qwen25-7b-s0-ema, X-posthoc-noprobe-qwen25-7b-s0-ema]
