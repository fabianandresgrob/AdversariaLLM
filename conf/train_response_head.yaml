defaults:
  - models: models
  - datasets: datasets
  - splits
  - paths
  - _self_

# Offline response channel for a DualProbe (train_response_head.py). The model and its co-trained
# prompt_last probe stay frozen; only the response head trains, on the model's own judged attack
# completions (outputs/<attack>__<defense>__<model>/...).
name: null                     # required; jobs injects the run name
model: E-nd6-s0                # models.yaml entry: adapter + prompt_last reader_path
out_dir: ${root_dir}/checkpoints_probe/RH/${name}
seed: 0
layer: -1

attacks: [inpainting, pair, gcg, pgd]  # read from outputs/; those run on test behaviors are evaluated
train_attacks: ${attacks}          # subset that trains the head (leave one out to test transfer)
defense: none                      # the raw model's completions
classifier: strong_reject
pos_threshold: 0.5                 # hit: the ASR threshold
neg_threshold: 0.1                 # clear miss; the band in between is dropped as label noise
test_dataset: jbb_behaviors
test_below: 20                     # held out: test_dataset behaviors with idx < 20 (the eval set)
cap_per_group: 12                  # per (behavior, attack, label); test hits are never capped

# benign: the model's own greedy answers to alpaca prompts per split window
benign_n: {train: 400, calib: 1000, test: 200}
max_new_tokens: 256                # the attacks' generation budget
gen_batch_size: 64
fpr: 0.01                          # combined budget on the calib window; fpr/2 per channel

response_window: 16                # tokens per rolling window; a huge value (100000) = mean over the answer
max_response_tokens: 256
batch_size: 16                     # forward passes
train_batch_size: 64
epochs: 30
lr: 1.0e-3
weight_decay: 1.0e-4
