# I (round 2): ablation from the best-known config, detector-aware. Full = eps=0.05, lambda_kl=2, ndet=6,
# easy_benign_sources=[alpaca, or_bench], magpie/1024, attack.use_detector=true.
# Row 'lrep0': coupling off: the lambda_rep test in the regime lambda_rep is for
entrypoint: run_coop_train.py
name: I-lrep0-s{seed}
time_per_run: "05:00:00"
overrides:
  attack.enabled: true
  training.n_steps: 1000
  training.val_every: 25
  data.kl_source: magpie
  data.kl_max_length: 1024
  epsilon: 0.05
  attack.use_detector: true
  lambda_kl: 2.0
  training.n_detector_steps: 6
  data.easy_benign_sources: [alpaca, or_bench]
  lambda_rep: 0.0
  output.checkpoint_path: ${root_dir}/checkpoints_coop/I-ablation
sweep:
  seed: [0, 1, 2]
artifacts:
  - checkpoints_coop/I-ablation/{name}/final_adapter
  - checkpoints_coop/I-ablation/{name}/final_reader.pt
