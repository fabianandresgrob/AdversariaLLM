# X (Qwen/Qwen2.5-7B-Instruct): judged xs_test over-refusal, model alone and pipeline (model refuses OR the probe flags, at the calibrated threshold; eval-calib-X-qwen25-7b first). Judge google/gemma-3-12b-it, so no model judges itself. Model and chat template set explicitly (defaults are Llama).
entrypoint: run_overrefusal_eval.py
name: overrefusal-{+arm}
time_per_run: 02:00:00
overrides:
  model: Qwen/Qwen2.5-7B-Instruct
  chat_template_id: Qwen/Qwen2.5-7B-Instruct
  ~checkpoints.base: base
  +checkpoints.model: ${models.${arm}.adapter_path}
  +readers.model: ${models.${arm}.reader_path}
  out: ${root_dir}/outputs/eval/overrefusal/X/${arm}
  judge.enabled: true
  judge.model: google/gemma-3-12b-it
sweep:
  +arm: [X-coop-qwen25-7b-s0-ema, X-posthoc-noprobe-qwen25-7b-s0-ema]
