# R: the best coop recipe with the KL leash at 256 tokens (as coop-R-kl256) plus perturbed benign examples for the
# probe: the harmful class is always perturbed and the benign class never was, so the probe could learn "perturbed
# or not" instead of "harmful or not" -- which would explain why the coop probe catches 0% of GCG, PAIR and
# inpainting (unperturbed text) while the probe trained next to the no-probe model catches most GCG and PAIR.
entrypoint: run_coop_train.py
name: R-gate{epsilon}-it{attack.iters}-kl{data.kl_max_length}-detpert-s{seed}
time_per_run: "08:00:00"
overrides:
  attack.enabled: true
  attack.perturb: user
  attack.target_eot: false
  attack.eps: 0.1
  training.n_detector_steps: 6
  training.val_every: 50
  training.rep_warmup_steps: 0
  training.benign_gen_n: 40
  training.ema_decay: 0.995
  data.kl_source: magpie
  data.val_size: 24
  data.val_targets: 6
  data.val_batch_size: 16
  lambda_benign_perturb: 1.0
  training.detector_perturb_benign: true
  output.checkpoint_path: ${root_dir}/checkpoints_coop/R
  attack.use_detector: true
  attack.iters: 50
  training.n_steps: 1000
sweep:
  epsilon: [0.25]
  data.kl_max_length: [256]
  seed: [0]
artifacts:
  - checkpoints_coop/R/{name}/final_adapter
  - checkpoints_coop/R/{name}/final_reader.pt
