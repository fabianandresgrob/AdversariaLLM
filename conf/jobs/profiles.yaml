# Launch profiles: what condor_jobs.py adds to each entrypoint's arguments (adversariallm/jobs/spec.py: Profile).
# config_name must match the script's @hydra.main config (checked by tests/test_jobs_config.py).
run_coop_train.py:
  config_name: coop_train
  name_key: name
  wandb_dir_key: wandb.dir
  rerun_overrides:
    output.overwrite: true   # a rerun deliberately replaces the finished checkpoint (guard in coop_loop)
run_train.py:
  config_name: train
  name_key: name
  wandb_dir_key: wandb.dir
run_attacks.py:
  config_name: config
  uses_db: true
  extra_overrides:
    attacks.inpainting.custom_data_path: ${root_dir}/data/inpainting_attack.csv  # not in the repo: copy it there for inpainting
  rerun_overrides:
    overwrite: true
run_judges.py:
  config_name: judge
  uses_db: true
run_sampling.py:
  config_name: sampling
  uses_db: true
run_cross_attack_eval.py:
  config_name: cross_attack_eval
run_overrefusal_eval.py:
  config_name: overrefusal
run_pretrain_probe.py:
  config_name: pretrain_probe
  name_key: name
run_calibrate_probe.py:
  config_name: calibrate_probe
  rerun_overrides:
    overwrite: true   # a rerun replaces the run's own threshold files
probe_diagnose.py:              # shares calibrate_probe's config (model, probe, layer, batch_size)
  config_name: calibrate_probe
train_response_head.py:
  config_name: train_response_head
  name_key: name
inspect_embedding_attack.py:
  config_name: inspect_embedding_attack
  name_key: name
build_answer_pool.py:
  config_name: build_answer_pool
  name_key: name
rescore_answer_probe.py:
  config_name: rescore_answer_probe
  name_key: name
rejudge_answers.py:
  config_name: rejudge_answers
  name_key: name
score_embedding_attack.py:
  config_name: score_embedding_attack
  name_key: name
probe_prompt_conditions.py:
  config_name: probe_prompt_conditions
  name_key: name
reread_monitor_eval.py:
  config_name: reread_monitor_eval
  name_key: name
offline_probe_study.py:
  config_name: offline_probe_study
  name_key: name
run_utility_eval.py:
  config_name: utility_eval
run_gate_diagnostics.py:
  config_name: gate_diagnostics
run_generate_benign_targets.py:
  config_name: generate_benign_targets
generate_answers.py:
  config_name: generate_answers
  name_key: name
judge_flagged_raw.py:
  config_name: judge_flagged_raw
  name_key: name
adversariallm.jobs.smoke:      # test job for condor_jobs.py, no Hydra
  name_key: name
  hydra_dir: false
  uses_db: true
score_prompt_probe.py:
  config_name: score_prompt_probe
  name_key: name
prompt_probe_embedding_attack.py:
  config_name: prompt_probe_embedding_attack
  name_key: name
