# X (Qwen/Qwen2.5-7B-Instruct): the embedding attack at 100 iterations and this model's radius (ε = 0.3), model-only and probe-aware, as eval-crossattack-W-coop. Model and chat template set explicitly (defaults are Llama).
entrypoint: run_cross_attack_eval.py
name: xattack-X-posthoc-cat-qwen25-7b-s0-ema-a{seed}
time_per_run: "03:00:00"
overrides:
  model: Qwen/Qwen2.5-7B-Instruct
  chat_template_id: Qwen/Qwen2.5-7B-Instruct
  adapter_path: ${root_dir}/checkpoints_cat/X/X-cat-qwen25-7b-kl16.0-s0/ema_step500_adapter
  reader_path: ${root_dir}/checkpoints_coop/X-posthoc-cat/X-posthoc-cat-qwen25-7b-s0/ema_reader.pt
  eval_use_detector: [true, false]
  eval_detector_coeffs: [0.5]
  attack.iters: 100
  attack.eps: 0.3
  attack.target_eot: false
  attack.perturb: user
  harmful.val_size: 24
  harmful.val_targets: 6
  harmful.batch_size: 4
  benign.benign_gen_n: 40
  judge.enabled: true
  harmful.answer_pool: ${root_dir}/outputs/eval/answer_pool/pool-heretic.jsonl
  harmful.answer_max_tokens: 512
  out: ${root_dir}/outputs/eval/cross_attack/X/X-posthoc-cat-qwen25-7b-s0-ema/seed${seed}
sweep:
  seed: [0]
