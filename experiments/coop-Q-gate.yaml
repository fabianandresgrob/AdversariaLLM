# The Q benign-perturbation recipe with a higher refusal-gate floor (epsilon 0.05 -> 0.25). With the floor at 0.05
# the model gets almost no refusal gradient whenever the probe catches the attack, drifts back to complying until
# the probe misses, and the cycle repeats; a floor keeps some refusal pressure regardless of the probe (the cost:
# less division of labour, maybe more over-refusal). At 100 and 50 attack iterations, with the EMA saved as in
# coop-Q-seeds-*.
entrypoint: run_coop_train.py
name: Q-bp-it{attack.iters}-gate{epsilon}-s{seed}
time_per_run: "08:00:00"
overrides:
  attack.enabled: true
  attack.perturb: user
  attack.target_eot: false
  attack.use_detector: true
  attack.eps: 0.1
  training.n_detector_steps: 6
  training.n_steps: 1000
  training.val_every: 50
  training.rep_warmup_steps: 0
  training.benign_gen_n: 40
  training.ema_decay: 0.995
  data.kl_source: magpie
  data.kl_max_length: 1024
  data.val_size: 24
  data.val_targets: 6
  data.val_batch_size: 16
  lambda_benign_perturb: 1.0
  output.checkpoint_path: ${root_dir}/checkpoints_coop/Q
sweep:
  attack.iters: [100, 50]
  epsilon: [0.25]
  seed: [0]
artifacts:
  - checkpoints_coop/Q/{name}/final_adapter
  - checkpoints_coop/Q/{name}/final_reader.pt
