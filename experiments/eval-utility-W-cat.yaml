# W: calibration of the CAT arm (cat-W-cat): MMLU / ARC-C / GSM8K of the EMA models of the three KL weights. Pick the strongest
# one with judged xs_test refusal <= 0.20 and intact utility; it gets seeds 1 and 2.
entrypoint: run_utility_eval.py
name: utility-{+run}-ema
time_per_run: 02:00:00
overrides:
  +block: W
  adapter_path: ${root_dir}/checkpoints_cat/${block}/${run}/ema_adapter
  vllm.max_lora_rank: 64          # the recipe's LoRA is rank 64
  out: ${root_dir}/outputs/eval/utility/${block}/${run}-ema
artifacts:
- outputs/eval/utility/{+block}/{+run}-ema/utility.json
sweep:
  +run: [W-cat-kl1.0-s0, W-cat-kl2.0-s0, W-cat-kl4.0-s0]
