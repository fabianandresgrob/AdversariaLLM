# R: the best coop recipe (Q-bp-it50-gate0.25: gate floor 0.25, 50 attack iterations, benign perturbation, EMA)
# with the KL leash on 256-token sequences instead of 1024. The KL averages over all positions, so on long Magpie
# examples it barely constrains the first answer tokens, where refuse or answer is decided; the CAT-KL run (T,
# 256 tokens) over-refused less than its SFT twin. Does a shorter leash lower coop's over-refusal?
entrypoint: run_coop_train.py
name: R-gate{epsilon}-it{attack.iters}-kl{data.kl_max_length}-s{seed}
time_per_run: "08:00:00"
overrides:
  attack.enabled: true
  attack.perturb: user
  attack.target_eot: false
  attack.eps: 0.1
  training.n_detector_steps: 6
  training.val_every: 50
  training.rep_warmup_steps: 0
  training.benign_gen_n: 40
  training.ema_decay: 0.995
  data.kl_source: magpie
  data.val_size: 24
  data.val_targets: 6
  data.val_batch_size: 16
  lambda_benign_perturb: 1.0
  output.checkpoint_path: ${root_dir}/checkpoints_coop/R
  attack.use_detector: true
  attack.iters: 50
  training.n_steps: 1000
sweep:
  epsilon: [0.25]
  data.kl_max_length: [256]
  seed: [0]
artifacts:
  - checkpoints_coop/R/{name}/final_adapter
  - checkpoints_coop/R/{name}/final_reader.pt
