# W ablation (planning/specs/2026-10-06-coop-vs-noncoop.md): no gate. Refusal loss on every attacked prompt (epsilon 1.0, as in no coop); representation term and probe-aware attack stay on. Does it matter that the probe decides where refusal is pushed?
# Otherwise exactly coop-W-coop (one seed first).
entrypoint: run_coop_train.py
name: W-abl-nogate-s{seed}
time_per_run: "12:00:00"
overrides:
  attack.enabled: true
  attack.perturb: user
  attack.target_eot: false
  attack.eps: 0.1
  attack.iters: 50
  attack.use_detector: true
  reader.readout: response_window
  reader.readout_k: 512
  reader.window: 16
  probe_init: random
  data.answer_pool: ${root_dir}/outputs/eval/answer_pool/pool-heretic.jsonl
  data.answer_max_tokens: 512
  training.detector_refusal_negatives: true
  training.rep_warmup_steps: 50
  training.n_detector_steps: 6
  training.n_steps: 1000
  training.val_every: 50
  training.checkpoint_every: 250
  training.benign_gen_n: 40
  training.ema_decay: 0.995
  data.kl_source: magpie
  data.kl_max_length: 1024
  data.val_size: 24
  data.val_targets: 6
  data.val_batch_size: 16
  lambda_benign_perturb: 1.0
  epsilon: 1.0
  output.checkpoint_path: ${root_dir}/checkpoints_coop/W-abl
sweep:
  seed: [0]
artifacts:
  - checkpoints_coop/W-abl/{name}/final_adapter
  - checkpoints_coop/W-abl/{name}/final_reader.pt
