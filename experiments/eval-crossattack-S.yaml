# CAT with the fixed attack (cat-S-fixed) under the 100-iteration embedding attack, as eval-crossattack-Q2 but
# model-only (no probe exists; the reader stays random and its columns are ignored), judged.
entrypoint: run_cross_attack_eval.py
name: xattack-{+run}-a{seed}
time_per_run: "02:00:00"
overrides:
  +block: S-cat
  adapter_path: ${root_dir}/checkpoints_cat/${block}/${run}/final_adapter
  eval_use_detector: [false]
  attack.iters: 100
  attack.eps: 0.1
  attack.target_eot: false
  attack.perturb: user
  harmful.val_size: 24
  harmful.val_targets: 6
  harmful.batch_size: 16
  benign.benign_gen_n: 40
  judge.enabled: true
  out: ${root_dir}/outputs/eval/cross_attack/${block}/${run}/seed${seed}
sweep:
  +run:
  - S-cat-ce-away0.25-s0
  - S-cat-ce-away1.0-s0
  seed: [0]
artifacts:
  - outputs/eval/cross_attack/{+block}/{+run}/seed{seed}/cross_attack_eval.json
