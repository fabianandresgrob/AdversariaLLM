# X (google/gemma-3-12b-it): 1%-FPR threshold of each arm's probe on 2000 held-out Alpaca answers the model generates; the probe defense and pipeline over-refusal read it. Model and chat template set explicitly (defaults are Llama).
entrypoint: run_calibrate_probe.py
name: calib-{+arm}
time_per_run: 01:30:00
overrides:
  model: google/gemma-3-12b-it
  chat_template_id: google/gemma-3-12b-it
  adapter_path: ${models.${arm}.adapter_path}
  checkpoint_path: ${models.${arm}.reader_path}
  calibration_window: calib
sweep:
  +arm: [X-coop-gemma3-12b-s0-ema]  # arms are added as their probes finish
