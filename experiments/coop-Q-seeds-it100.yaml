# Seeds 1-2 of the Q benign-perturbation recipe at 100 attack iterations (seed 0 ran ad hoc as exp coop-Q; same
# overrides). Q-bp-s0 and Q-bp-it50-s0 traded off harm vs over-refusal at one seed each; these tell whether that is real.
entrypoint: run_coop_train.py
name: Q-bp-s{seed}
time_per_run: "08:00:00"
overrides:
  attack.enabled: true
  attack.perturb: user
  attack.target_eot: false
  attack.use_detector: true
  attack.eps: 0.1
  attack.iters: 100
  training.n_detector_steps: 6
  training.n_steps: 1000
  training.val_every: 50
  training.rep_warmup_steps: 0
  training.benign_gen_n: 40
  data.kl_source: magpie
  data.kl_max_length: 1024
  data.val_size: 24
  data.val_targets: 6
  data.val_batch_size: 16
  epsilon: 0.05
  lambda_benign_perturb: 1.0
  output.checkpoint_path: ${root_dir}/checkpoints_coop/Q
sweep:
  seed: [1, 2]
artifacts:
  - checkpoints_coop/Q/{name}/final_adapter
  - checkpoints_coop/Q/{name}/final_reader.pt
