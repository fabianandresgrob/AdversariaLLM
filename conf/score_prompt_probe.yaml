defaults:
  - models: models
  - paths
  - _self_

# score_prompt_probe.py: EuroSafeGuard's released prompt probe on stored attack prompts or a benign set (R1.2).
source: null              # attack name (pair, jailbreak_r1, gcg, gcg_adaptive, ...) or xs_test | or_bench | alpaca
sources: null             # several sources with one model load (overrides source)
model: null               # null: the probe's base model (R1.2); a models.yaml entry, with its adapter (R1.3)
template: theirs          # theirs: the tokenizer's own chat template; ours: the models.yaml entry's chat_template
prompt_system: null       # attack prompts only from <attack>__none__<prompt_system>/ (null: every system)
outputs_dir: ${root_dir}/outputs   # where the stored attack runs are (<attack>__<defense>__<model>/**/run.json)
probe_repo: EuroSafeAI/EuroSafeGuard-v1
# The probe's base_model is meta-llama/Llama-3.1-8B-Instruct; the cache holds its weights under the older repo name,
# the same commit (0e9e39f). null = the probe's own base_model.
base_model: meta-llama/Meta-Llama-3.1-8B-Instruct
allow_cpu: false
alpaca_n: 2000            # seeded sample of Alpaca instructions
shard: 0
num_shards: 1
token_budget: 16384       # rows x longest row per batch (all 32 layers of hidden states are kept per batch)
max_rows: 64
log_every: 2000
seed: 0
out: ${root_dir}/outputs/eval/prompt_probe/eurosafeguard
name: null                # jobs injects the run name
