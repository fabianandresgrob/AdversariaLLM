# W: post-hoc probe on the frozen CAT model (planning/specs/2026-10-06-coop-vs-noncoop.md). CAT KL 8 at its step-500
# EMA checkpoint (the one with xs_test <= 0.20), loaded and frozen (training.train_model: false); only the probe trains,
# with exactly coop-W-coop's probe recipe and training attack (detector-aware, against the frozen model).
entrypoint: run_coop_train.py
name: W-posthoc-cat-s{seed}
time_per_run: "12:00:00"
overrides:
  init_adapter: ${root_dir}/checkpoints_cat/W/W-cat-kl8.0-s${seed}/ema_step500_adapter
  training.train_model: false
  attack.enabled: true
  attack.perturb: user
  attack.target_eot: false
  attack.eps: 0.1
  attack.iters: 50
  attack.use_detector: true
  reader.readout: response_window
  reader.readout_k: 512
  reader.window: 16
  probe_init: random
  data.answer_pool: ${root_dir}/outputs/eval/answer_pool/pool-heretic.jsonl
  data.answer_max_tokens: 512
  training.detector_refusal_negatives: true
  training.rep_warmup_steps: 50
  training.n_detector_steps: 6
  training.n_steps: 1000
  training.val_every: 50
  training.checkpoint_every: 250
  training.benign_gen_n: 40
  training.ema_decay: 0.995
  data.kl_source: magpie
  data.kl_max_length: 1024
  data.val_size: 24
  data.val_targets: 6
  data.val_batch_size: 16
  lambda_benign_perturb: 1.0
  epsilon: 0.05
  output.checkpoint_path: ${root_dir}/checkpoints_coop/W-posthoc-cat
sweep:
  seed: [0, 1, 2]
artifacts:
  - checkpoints_coop/W-posthoc-cat/{name}/final_adapter
  - checkpoints_coop/W-posthoc-cat/{name}/final_reader.pt
