# R2.5 (item 32): the finished coop model (W-coop-s0 EMA adapter), frozen (training.train_model false); only a
# fresh probe trains, with coop-W-coop's probe recipe and training attack. Compared with W-coop's co-trained probe on
# the same model: what does training the probe together with the model add over a probe trained afterwards?
# Everything else as coop-W-coop (W-coop's config, our chat template), seed 0, round 2.
entrypoint: run_coop_train.py
name: W-posthoc-coop-s{seed}
time_per_run: "12:00:00"
overrides:
  attack.enabled: true
  attack.perturb: user
  attack.target_eot: false
  attack.eps: 0.1
  attack.iters: 50
  attack.use_detector: true
  reader.readout: response_window
  reader.readout_k: 512
  reader.window: 16
  probe_init: random
  data.answer_pool: ${root_dir}/outputs/eval/answer_pool/pool-heretic.jsonl
  data.answer_max_tokens: 512
  training.detector_refusal_negatives: true
  training.rep_warmup_steps: 50
  training.n_detector_steps: 6
  training.n_steps: 1000
  training.val_every: 50
  training.checkpoint_every: 250
  training.benign_gen_n: 40
  training.ema_decay: 0.995
  data.kl_source: magpie
  data.kl_max_length: 1024
  data.val_size: 24
  data.val_targets: 6
  data.val_batch_size: 16
  lambda_benign_perturb: 1.0
  epsilon: 0.05
  output.checkpoint_path: ${root_dir}/checkpoints_coop/W-posthoc-coop
  init_adapter: ${root_dir}/checkpoints_coop/W/W-coop-s${seed}/ema_adapter
  training.train_model: false
sweep:
  seed: [0]
artifacts:
  - checkpoints_coop/W-posthoc-coop/{name}/final_adapter
  - checkpoints_coop/W-posthoc-coop/{name}/final_reader.pt
