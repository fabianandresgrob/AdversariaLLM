defaults:
  - models: models
  - datasets: datasets
  - splits
  - paths
  - _self_

mode: coop
name: coop_run
seed: 0                # training randomness (LoRA/probe init, shuffle); eval splits use data.val_seed

# Group Hydra outputs by run name (timestamp subdir keeps reruns of the same name separate).
hydra:
  run:
    dir: outputs/${name}/${now:%Y-%m-%d_%H-%M-%S}

# Same target as model-CAT: models.yaml key for loading, separate id for get_chat_template.
model: meta-llama/Meta-Llama-3.1-8B-Instruct
chat_template_id: meta-llama/Llama-3.1-8B-Instruct

reader:
  type: linear        # linear | (mlp/gemma later)
  layer: -1           # target-model hidden layer the probe reads
  readout: prompt_last  # prompt_last | stream_last | response_mean (what the probe may attend over)
  readout_k: 8          # response_mean only: how many response tokens the window covers
# "random" or a pretrained probe.pt from run_pretrain_probe (fixes the OOD-benign collapse).
probe_init: ${root_dir}/checkpoints_probe/probe_v3/probe.pt

# Gating / objective (design doc §3-§6). Floors default to the decoupled (1,1) control.
tau: 1.0
tau_b: 1.0            # unused since the w_mb validation diagnostic was removed (2026-09-24); kept for old configs
epsilon: 0.05         # behavior-gate floor
delta: 0.0            # rep-gate floor; LOCKED at 0 (v1 stability result)
lambda_beh: 1.0
lambda_rep: 1.0
lambda_kl: 1.0
# Optional benign terms (0 = off, the behaviour of all runs before 2026-09-24):
lambda_kl_head: 0.0          # KL on only the first kl_head_tokens answer tokens (the refuse/answer decision)
kl_head_tokens: 32
lambda_benign_perturb: 0.0   # benign prompt with a random user-message perturbation must answer like the
                             # clean prompt (KL on the same head tokens): breaks "perturbed => refuse"
benign_perturb_eps: null     # perturbation radius as a multiple of the mean embedding norm; null = attack.eps

# Stage A = no attack (clean prompt); Stage B = continuous embedding attack.
attack:
  enabled: false
  iters: 100
  eps: 1.0
  lr: 0.01
  use_detector: false        # Stage C: attack also evades the reader (detector-aware adversary)
  detector_loss_coeff: 0.5   # attacker's evade-detector vs elicit-harmful trade-off (used iff use_detector)
  # false: the attack's loss skips the end-of-turn token after the target, so it elicits the target
  # without also optimizing "then stop" (runs before 2026-09-23 used true: stub, then stop)
  target_eot: false
  # user: perturb only the user message (answers stay coherent and genuinely harmful); all: every
  # prompt position incl. the chat template (runs before 2026-09-23; elicits the stub, then loops)
  perturb: user

data:
  dir: ${root_dir}/data
  behaviors: behavior_datasets/extra_behavior_datasets/adv_training_behaviors.csv
  targets: optimizer_targets/extra_targets/adv_training_targets.json
  safe: safe_responses/adv_training_behaviors_safe_responses_longer.csv
  harmful_batch_size: 4
  utility_batch_size: 4
  val_size: 16                      # harmful behaviors held out for validation
  val_targets: 4                    # targets per val behavior -> 64 attacked val prompts
  val_batch_size: null              # val attack/generation batch; null = harmful_batch_size (4)
  val_seed: 0
  # Benign split: easy = detector class + PINNED calibration.
  kl_source: ultrachat              # KL-leash dataset; any registered source (e.g. magpie) or ultrachat
  kl_max_length: null               # truncate leash examples to N tokens (magpie responses run ~90k chars)
  # KL uses the kl_source train window. xs_test is NEVER a training source (held out for over-refusal + FPR).
  easy_benign_sources: [alpaca]     # detector easy-benign class (train windows); NOT xs_test
  calibration_benign: alpaca        # PINNED 1%-FPR threshold set (val window), frozen across runs

training:
  model_lr: 5.0e-5
  detector_lr: 1.0e-3        # detector is cheap/fast (§8): higher lr than the model
  n_steps: 450
  n_detector_steps: 1        # spec default (tunable ablation; δ=0/N=3 is a valid alt)
  rep_warmup_steps: 0        # default off (prefitted probe); >0 for the cold-probe ablation
  checkpoint_every: 250      # 4 step-tagged adapters/run (~180MB); enough to inspect the oscillation
  ema_decay: null            # e.g. 0.995: also save an EMA of adapter + probe (ema_adapter); training unchanged
  val_every: 25              # held-out recall@1%FPR, OOD over-refusal, four-case frequencies
  benign_gen_n: 16           # xs_test AND alpaca prompts free-generated for the refusal rates
  val_attack_gen_tokens: 96  # continuation length under the val attack (model/asr_gen)
  refit_buffer_steps: 100    # training steps of features the fresh-refit probe is fit on
  detector_replay: false     # true: detector steps also train on that buffer (more attacked prompts per update)
  benign_val_max_new_tokens: 32

output:
  # per-experiment subdir keeps two ablations from resolving to the same run name
  checkpoint_path: ${root_dir}/checkpoints_coop
  overwrite: false      # true = replace a finished run in place (guard is opt-out)

wandb:
  enabled: true
  project: detector-ma
  entity: null
  dir: ${root_dir}/wandb_logs
