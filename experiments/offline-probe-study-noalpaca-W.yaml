# PAIR analysis, step 5c: WildGuardTest instead of the Alpaca answers (the offline counterpart of coop-W-wg-noalpaca),
# same models and evaluation as offline-probe-study-W; output <model>-noalpaca.json.
entrypoint: offline_probe_study.py
name: probestudy-noalpaca-{model}
time_per_run: "01:30:00"
overrides:
  train_sets: [ours_noalpaca+wildguard]
  tag: -noalpaca
sweep:
  model: [W-coop-s0-ema, W-posthoc-noprobe-s0-ema, W-posthoc-cat-s0-ema]
artifacts:
  - outputs/eval/offline_probe_study/{model}-noalpaca.json
