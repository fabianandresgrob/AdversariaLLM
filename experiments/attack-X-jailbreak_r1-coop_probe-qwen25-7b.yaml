# X (Qwen/Qwen2.5-7B-Instruct): Jailbreak-R1 against the pipeline (refusal when the probe fires at its 1% threshold), JBB 0-19, the first 64 prompts of the shared cache (attack-jailbreak_r1-fill-b0-20; the prompts never see the target, so every model reads the same ones).
entrypoint: run_attacks.py
name: jailbreak_r1-{model}-b0-20
time_per_run: "02:00:00"
overrides:
  attack: jailbreak_r1
  dataset: jbb_behaviors
  datasets.jbb_behaviors.idx: list(range(0,20))
  attacks.jailbreak_r1.num_steps: 64
  attacks.jailbreak_r1.prompt_cache_mode: read
  attacks.jailbreak_r1.prompt_cache_path: ${root_dir}/outputs/eval/jailbreak_r1/prompt_cache_jbb.json
  attacks.jailbreak_r1.prompt_cache_subset_strategy: first_n
  defense: coop_probe
sweep:
  model: [X-coop-qwen25-7b-s0-ema, X-posthoc-noprobe-qwen25-7b-s0-ema, X-posthoc-cat-qwen25-7b-s0-ema]
