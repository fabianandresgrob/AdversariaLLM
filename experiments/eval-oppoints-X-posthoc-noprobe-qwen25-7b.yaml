name: oppoints-X-posthoc-noprobe-qwen25-7b-s0-ema
time_per_run: 01:30:00
overrides:
  model: Qwen/Qwen2.5-7B-Instruct
  chat_template_id: Qwen/Qwen2.5-7B-Instruct
  adapter_path: ${root_dir}/checkpoints_coop/X/X-noprobe-qwen25-7b-s0/ema_adapter
  checkpoint_path: ${root_dir}/checkpoints_coop/X-posthoc/X-posthoc-noprobe-qwen25-7b-s0/ema_reader.pt
