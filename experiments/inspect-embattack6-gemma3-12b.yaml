# Is our embedding attack working on google/gemma-3-12b-it? The Llama sanity check (inspect-embattack4/5, 2026-09-24/10-05) on the base
# instruct model: 10 training behaviors x 12 targets = 120 attacks, user message only, radius x iterations. Judged and
# sorted afterwards by score_embedding_attack.py (eval-embattack6-score).
entrypoint: inspect_embedding_attack.py
name: embattack6-gemma3-12b-user-eps{attack.eps}-it{attack.iters}
time_per_run: "02:00:00"
overrides:
  model: google/gemma-3-12b-it
  chat_template_id: google/gemma-3-12b-it
  perturb: user
sweep:
  attack.eps: [0.05, 0.1, 0.25]
  attack.iters: [50, 100]
