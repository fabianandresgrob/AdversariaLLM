defaults:
  - models: models
  - paths
  - _self_

# pretrain_prompt_probe.py: EuroSafeGuard's prompt probe design on their prompt data, on a frozen model.
name: null                # required: folder under `out` (jobs inject the run name)
prompts: /fast/fgrob/coop-detect/esg_data/probe_train_full.parquet   # their probe set, withheld rows filled
out: ${root_dir}/checkpoints_probe/prompt_mlp
model: meta-llama/Meta-Llama-3.1-8B-Instruct   # models.yaml entry
adapter_path: null        # a trained LoRA adapter on top (a probe trained afterwards)
template: theirs          # the tokenizer's own chat template (Meta's), as their probe was trained
allow_cpu: false
reader:
  type: prompt_mlp
  layer: all              # the output of every block
  hidden: 256
  window: 16              # M: sliding window in the loss, moving-average span in the score
max_len: 2048             # longer prompts are cut from the left
batch_size: 8
epochs: 1
lr: 0.001
weight_decay: 0.01
twins: true               # add the plain twin of every rewritten prompt to its batch
val_frac: 0.05            # share of input_id groups held out
seed: 0
limit: null               # only n random rows (test runs)
log_every: 200
save_every: 1000
overwrite: false
